<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 250" fill="none">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <!-- Loop -->
  <rect x="20" y="40" width="120" height="160" rx="8" fill="#3B82F6" opacity="0.1" stroke="#3B82F6" stroke-width="2"/>
  <text x="80" y="65" text-anchor="middle" fill="#3B82F6" font-size="13" font-family="system-ui" font-weight="bold">Agent Loop</text>
  <text x="80" y="130" text-anchor="middle" fill="#666" font-size="11" font-family="system-ui">calls</text>
  <text x="80" y="150" text-anchor="middle" fill="#666" font-size="11" font-family="system-ui">tool_by_name</text>
  <!-- Dispatch Map -->
  <rect x="190" y="30" width="150" height="180" rx="8" fill="#8B5CF6" opacity="0.1" stroke="#8B5CF6" stroke-width="2"/>
  <text x="265" y="55" text-anchor="middle" fill="#8B5CF6" font-size="13" font-family="system-ui" font-weight="bold">Dispatch Map</text>
  <text x="265" y="85" text-anchor="middle" fill="#666" font-size="11" font-family="system-ui">"bash" → run_bash</text>
  <text x="265" y="105" text-anchor="middle" fill="#666" font-size="11" font-family="system-ui">"read" → run_read</text>
  <text x="265" y="125" text-anchor="middle" fill="#666" font-size="11" font-family="system-ui">"write" → run_write</text>
  <text x="265" y="145" text-anchor="middle" fill="#666" font-size="11" font-family="system-ui">"edit" → run_edit</text>
  <text x="265" y="165" text-anchor="middle" fill="#666" font-size="11" font-family="system-ui">"glob" → run_glob</text>
  <!-- Arrow Loop → Dispatch -->
  <line x1="140" y1="120" x2="188" y2="120" stroke="#666" stroke-width="2" marker-end="url(#arrow2)"/>
  <!-- Handlers -->
  <rect x="390" y="20" width="140" height="60" rx="6" fill="#10B981" opacity="0.1" stroke="#10B981" stroke-width="1.5"/>
  <text x="460" y="45" text-anchor="middle" fill="#10B981" font-size="11" font-family="system-ui">Tool Handler 1</text>
  <text x="460" y="62" text-anchor="middle" fill="#666" font-size="10" font-family="system-ui">(bash, read, ...)</text>
  <rect x="390" y="100" width="140" height="60" rx="6" fill="#F59E0B" opacity="0.1" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="460" y="125" text-anchor="middle" fill="#F59E0B" font-size="11" font-family="system-ui">Tool Handler 2</text>
  <text x="460" y="142" text-anchor="middle" fill="#666" font-size="10" font-family="system-ui">(write, edit, ...)</text>
  <rect x="390" y="180" width="140" height="40" rx="6" fill="#666" opacity="0.15" stroke="#666" stroke-width="1" stroke-dasharray="3"/>
  <text x="460" y="205" text-anchor="middle" fill="#666" font-size="10" font-family="system-ui">more...</text>
  <!-- Arrow Dispatch → Handlers -->
  <line x1="340" y1="55" x2="388" y2="55" stroke="#666" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="340" y1="135" x2="388" y2="135" stroke="#666" stroke-width="1.5" marker-end="url(#arrow2)"/>
</svg>
