    <tspan fill="#3b82f6">Claude Code</tspan>
    <tspan fill="#64748b"> · </tspan>
    <tspan fill="#10b981">Cursor</tspan>
    <tspan fill="#64748b"> · </tspan>
    <tspan fill="#f59e0b">GitHub Copilot</tspan>
    <tspan fill="#64748b"> — All share the same loop architecture with different policy layers</tspan>
  </text>
  <text x="170" y="629" fill="#64748b" font-size="8" font-family="system-ui">Key differentiators: Permission model · Plugin SDK · Skill system · Event bus · Agent teams</text>

