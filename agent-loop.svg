  <text x="242" y="561" text-anchor="middle" fill="#64748b" font-size="7" font-family="system-ui">while( tool_use )</text>

  <!-- s02: Tool Dispatch -->
  <rect x="335" y="530" width="145" height="38" rx="6" fill="#1e40af" stroke="#3b82f6" stroke-width="1.2"/>
