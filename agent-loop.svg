  <rect x="225" y="90" width="155" height="42" rx="6" fill="#1e3a5f" stroke="#ef4444" stroke-width="1.2"/>
  <text x="302" y="108" text-anchor="middle" fill="#fca5a5" font-size="10" font-family="system-ui" font-weight="bold">s11 · MCP Tools</text>
  <text x="302" y="122" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="system-ui">External tool protocol bridge</text>

