  <text x="477" y="108" text-anchor="middle" fill="#fca5a5" font-size="10" font-family="system-ui" font-weight="bold">s12 · Plugin System</text>
  <text x="477" y="122" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="system-ui">@opencode-ai/plugin</text>

